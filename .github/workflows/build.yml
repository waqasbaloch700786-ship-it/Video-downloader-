name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Project
        run: |
          for f in *.zip; do unzip -o "$f" 2>/dev/null || true; done
          rm -f *.zip
          ls -la
          # find gradlew and move to root
          ROOT=$(find . -maxdepth 3 -name gradlew -type f | head -1 | xargs dirname)
          echo "Found root: $ROOT"
          if [ "$ROOT" != "." ] && [ "$ROOT" != "" ]; then
            cp -r $ROOT/* . 2>/dev/null || true
            cp -r $ROOT/.* . 2>/dev/null || true
          fi
          ls -la
          ls -la gradle/wrapper/ || true
      - name: Fix Wrapper Jar
        run: |
          mkdir -p gradle/wrapper
          # sahi wala link
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar
          ls -lh gradle/wrapper/gradle-wrapper.jar
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
