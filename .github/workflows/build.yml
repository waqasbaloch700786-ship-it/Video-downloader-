name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Build APK
        run: |
          set -e
          echo "=== Unzip ==="
          for f in *.zip; do echo "Unzipping $f"; unzip -o "$f" || true; done
          rm -f *.zip
          echo "=== Find Manifest ==="
          MANIFEST=$(find . -type f -path "*/app/src/main/AndroidManifest.xml" | head -1)
          echo "Manifest found at: $MANIFEST"
          if [ -z "$MANIFEST" ]; then echo "No manifest found! Listing files:"; find . -type f | head -n 100; exit 1; fi
          # Project root = 4 levels up from manifest
          ROOT=$(dirname $(dirname $(dirname $(dirname "$MANIFEST"))))
          echo "Project ROOT: $ROOT"
          cd "$ROOT"
          pwd
          ls -la
          ls -la app/src/main/res/xml/ || true
          ls -la app/src/main/res/mipmap/ || true
          rm -rf gradle/wrapper gradlew gradlew.bat
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          wget -q https://services.gradle.org/distributions/gradle-8.11-bin.zip
          unzip -q gradle-8.11-bin.zip -d /tmp
          export PATH=/tmp/gradle-8.11/bin:$PATH
          gradle --version
          gradle assembleDebug --stacktrace
          find . -name "*.apk" -type f
          
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/app/build/outputs/apk/debug/*.apk
