name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and Find Project
        run: |
          for f in *.zip; do unzip -o "$f" || true; done
          rm -f *.zip
          find . -maxdepth 4 -type f -name gradlew | head -20
          echo "GRADLEW_PATH=$(find . -name gradlew -type f | head -1)" >> $GITHUB_ENV
          echo "PROJECT_DIR=$(dirname $(find . -name gradlew -type f | head -1))" >> $GITHUB_ENV
          cat $GITHUB_ENV
      - name: Fix Wrapper Jar
        run: |
          echo "Project dir is: ${{ env.PROJECT_DIR }}"
          ls -la ${{ env.PROJECT_DIR }}/
          ls -la ${{ env.PROJECT_DIR }}/gradle/wrapper/ || true
          mkdir -p ${{ env.PROJECT_DIR }}/gradle/wrapper
          curl -L -o ${{ env.PROJECT_DIR }}/gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar
          ls -lh ${{ env.PROJECT_DIR }}/gradle/wrapper/gradle-wrapper.jar
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
