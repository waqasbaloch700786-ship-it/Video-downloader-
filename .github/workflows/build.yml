name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Project
        run: |
          unzip -o "*.zip"
          rm -f *.zip
          ls -la
          if [ -d "AllVideoDownloader_Android_Project" ]; then mv AllVideoDownloader_Android_Project/* . 2>/dev/null || true; fi
          if [ -d "downloader" ]; then mv downloader/* . 2>/dev/null || true; fi
          ls -la
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-APK
          path: app/build/outputs/apk/debug/*.apk
