name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Project
        run: |
          for f in *.zip; do unzip -o "$f" || true; done
          rm -f *.zip
          echo "PROJECT_DIR=$(dirname $(find . -name gradlew -type f | head -1))" >> $GITHUB_ENV
          echo "PROJECT_DIR is $(cat $GITHUB_ENV)"
          ls -la
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK (Use Preinstalled)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "sdk.dir=/usr/local/lib/android/sdk" > ${{ env.PROJECT_DIR }}/local.properties || echo "sdk.dir=/usr/local/lib/android/sdk" > ./local.properties || true
          ls /usr/local/lib/android/sdk -la | head -20
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
