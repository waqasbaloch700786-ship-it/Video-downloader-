name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Project
        run: |
          for f in *.zip; do unzip -o "$f" || true; done
          rm -f *.zip
          echo "PROJECT_DIR=$(dirname $(find . -name gradlew -type f | head -1))" >> $GITHUB_ENV
          echo "Found: $(cat $GITHUB_ENV)"
          ls -la
          ls -la $(dirname $(find . -name gradlew -type f | head -1)) || true
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          chmod +x gradlew || true
          gradle wrapper --gradle-version 8.5 || true
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info | tail -n 300
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
