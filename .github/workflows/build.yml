name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install Gradle 8.11 Direct (No Wrapper Check)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11-bin.zip
          unzip -q gradle-8.11-bin.zip -d /tmp
          echo "/tmp/gradle-8.11/bin" >> $GITHUB_PATH
          
      - name: Build APK
        run: |
          for f in *.zip; do unzip -o "$f" || true; done
          rm -f *.zip
          DIR=$(dirname $(find . -name "build.gradle*" -type f | head -1))
          # fallback if gradlew found
          if [ -f "$(find . -name gradlew | head -1)" ]; then
            DIR=$(dirname $(find . -name gradlew | head -1))
          fi
          echo "Project DIR=$DIR"
          cd "$DIR"
          ls -la
          # remove broken wrapper completely
          rm -rf gradle/wrapper gradlew gradlew.bat
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          gradle --version
          gradle assembleDebug --stacktrace 2>&1 | tee build.log
          echo "==== APK SEARCH ===="
          find . -name "*.apk" -type f || true
          
      - name: Upload build-log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: "**/build.log"
          
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk
