name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          set -e
          for f in *.zip; do unzip -o "$f" || true; done
          rm -f *.zip
          MANIFEST=$(find . -type f -path "*/app/src/main/AndroidManifest.xml" | head -1)
          ROOT=$(dirname $(dirname $(dirname $(dirname "$MANIFEST"))))
          cd "$ROOT"
          echo "ROOT=$ROOT"
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/data_extraction_rules.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><data-extraction-rules><cloud-backup><include domain="sharedpref" path="."/></cloud-backup><device-transfer><include domain="sharedpref" path="."/></device-transfer></data-extraction-rules>
          EOF
          cat > app/src/main/res/xml/backup_rules.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><full-backup-content></full-backup-content>
          EOF
          python3 <<'PY'
          import zlib, struct, os, shutil
          def write_png(path):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              if os.path.exists(path): return
              w,h=48,48
              def chunk(t,d):
                  return struct.pack('>I', len(d))+t+d+struct.pack('>I', zlib.crc32(t+d) & 0xffffffff)
              hdr=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR', struct.pack('>IIBBBBB', w,h,8,2,0,0,0))
              raw=b''
              for _ in range(h):
                  raw+=b'\x00'+(b'\x21\x96\xf3'*w)
              png=hdr+chunk(b'IDAT', zlib.compress(raw))+chunk(b'IEND', b'')
              open(path,'wb').write(png)
              print(f"Created {path}")
          for d in ["mipmap-hdpi","mipmap-mdpi","mipmap-xhdpi","mipmap-xxhdpi","mipmap-xxxhdpi","mipmap"]:
              for n in ["ic_launcher.png","ic_launcher_round.png"]:
                  write_png(f"app/src/main/res/{d}/{n}")
          PY
          rm -rf gradle/wrapper gradlew gradlew.bat
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          wget -q https://services.gradle.org/distributions/gradle-8.11-bin.zip
          unzip -q gradle-8.11-bin.zip -d /tmp
          export PATH=/tmp/gradle-8.11/bin:$PATH
          gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-APK
          path: "**/build/outputs/apk/debug/*.apk"
