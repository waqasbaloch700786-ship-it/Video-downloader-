name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Project
        run: |
          for f in *.zip; do unzip -o "$f" || true; done
          rm -f *.zip
          echo "GRADLEW=$(find . -name gradlew -type f | head -1)" >> $GITHUB_ENV
          echo "PROJECT_DIR=$(dirname $(find . -name gradlew -type f | head -1))" >> $GITHUB_ENV
          cat $GITHUB_ENV
          ls -la
          ls -la ${{ env.PROJECT_DIR }} 2>/dev/null || find . -maxdepth 3 -type d | head -20
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build APK (No Wrapper)
        run: |
          echo "Building in: ${{ env.PROJECT_DIR }}"
          cd ${{ env.PROJECT_DIR }}
          ls -la
          chmod +x gradlew || true
          # agar wrapper jar missing hai to gradle se regenerate karo
          gradle wrapper --gradle-version 8.5 || true
          # ab build karo, wrapper ki jagah direct gradle use karo
          gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
