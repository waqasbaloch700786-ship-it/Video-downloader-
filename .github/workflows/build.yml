name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Build APK
        run: |
          for f in *.zip; do unzip -o "$f" || true; done
          rm -f *.zip
          DIR=$(dirname $(find . -name "build.gradle*" | head -1))
          if [ "$DIR" = "." ] || [ -z "$DIR" ]; then DIR=$(find . -name "app" -type d | head -1); fi
          if [ -z "$DIR" ]; then DIR="."; fi
          echo "DIR=$DIR"
          cd "$DIR/.." 2>/dev/null || true
          if [ ! -f build.gradle ]; then cd "$DIR"; fi
          pwd
          rm -rf gradle/wrapper gradlew gradlew.bat
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          cat local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls /usr/local/lib/android/sdk || true
          wget -q https://services.gradle.org/distributions/gradle-8.11-bin.zip
          unzip -q gradle-8.11-bin.zip -d /tmp
          export PATH=/tmp/gradle-8.11/bin:$PATH
          gradle --version
          gradle assembleDebug --stacktrace
          find . -name "*.apk"
          
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk
