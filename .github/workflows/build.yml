name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle 8.11
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11
      - name: Build APK
        run: |
          for f in *.zip; do unzip -o "$f" || true; done
          rm -f *.zip
          DIR=$(dirname $(find . -name "gradlew" -type f | head -1))
          echo "Project DIR=$DIR"
          cd "$DIR"
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          
          # --- FIX WRAPPER ---
          mkdir -p gradle/wrapper
          echo "Fixing wrapper properties to 8.11"
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.11-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          # Download fresh wrapper jar
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar
          ls -lh gradle/wrapper/
          
          # Build with wrapper now (checksum issue fixed)
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log || gradle assembleDebug --stacktrace 2>&1 | tee build.log
          
          echo "==== APK SEARCH ===="
          find . -name "*.apk" -type f
      - name: Upload build-log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: "**/build.log"
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk
