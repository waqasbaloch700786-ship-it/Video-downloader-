name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Build APK - No Wrapper Check
        run: |
          for f in *.zip; do unzip -o "$f" || true; done
          rm -f *.zip
          DIR=$(dirname $(find . -name "build.gradle*" | head -1))
          if [ -z "$DIR" ]; then DIR=$(dirname $(find . -name "gradlew" -type f | head -1)); fi
          if [ -z "$DIR" ]; then DIR="."; fi
          echo "Project DIR=$DIR"
          cd "$DIR"
          # delete broken wrapper to stop sha256 error
          rm -rf gradle/wrapper gradlew gradlew.bat
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          # install gradle 8.11 direct
          wget -q https://services.gradle.org/distributions/gradle-8.11-bin.zip
          unzip -q gradle-8.11-bin.zip -d /tmp
          export PATH=/tmp/gradle-8.11/bin:$PATH
          gradle --version
          gradle assembleDebug --stacktrace
          find . -name "*.apk" -type f
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk
