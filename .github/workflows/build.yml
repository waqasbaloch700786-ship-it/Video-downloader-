name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build APK Direct
        run: |
          for f in *.zip; do unzip -o "$f" || true; done
          rm -f *.zip
          GRADLEW=$(find . -name gradlew -type f | head -1)
          DIR=$(dirname "$GRADLEW")
          echo "Project at: $DIR"
          cd "$DIR"
          ls -la
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          cat local.properties
          # gradlew ko ignore karo, direct gradle use karo
          gradle assembleDebug --stacktrace
          echo "--- APKs ---"
          find . -name "*.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk
