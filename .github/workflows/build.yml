name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build APK Direct
        run: |
          for f in *.zip; do unzip -o "$f" || true; done
          rm -f *.zip
          DIR=$(dirname $(find . -name gradlew -type f | head -1))
          echo "Project: $DIR"
          cd "$DIR"
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          # show project files
          ls -la
          cat settings.gradle.kts 2>/dev/null || cat settings.gradle || true
          # try build with info, show first error
          gradle assembleDebug --stacktrace 2>&1 | head -n 400
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-APK
          path: |
            **/build/outputs/apk/debug/*.apk
