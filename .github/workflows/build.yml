name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          set -e
          for f in *.zip; do unzip -o "$f" || true; done
          rm -f *.zip
          MANIFEST=$(find . -type f -path "*/app/src/main/AndroidManifest.xml" | head -1)
          ROOT=$(dirname $(dirname $(dirname $(dirname "$MANIFEST"))))
          cd "$ROOT"
          echo "ROOT=$ROOT"
          echo "=== FIXING MISSING FILES ==="
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-hdpi
          cat > app/src/main/res/xml/data_extraction_rules.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules><cloud-backup><include domain="sharedpref" path="."/><exclude domain="sharedpref" path="device.xml"/></cloud-backup><device-transfer><include domain="sharedpref" path="."/><exclude domain="sharedpref" path="device.xml"/></device-transfer></data-extraction-rules>
          EOF
          cat > app/src/main/res/xml/backup_rules.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><full-backup-content><exclude domain="sharedpref" path="device.xml"/></full-backup-content>
          EOF
          # Install PIL
          pip3 install pillow -q
          python3 - <<'PY'
          from PIL import Image
          import os, shutil
          def make_icon(p):
              os.makedirs(os.path.dirname(p), exist_ok=True)
              if not os.path.exists(p):
                  img = Image.new('RGB', (512,512), color=(33,150,243))
                  img.save(p)
                  print(f"Created {p}")
          make_icon("app/src/main/res/mipmap-hdpi/ic_launcher.png")
          make_icon("app/src/main/res/mipmap-hdpi/ic_launcher_round.png")
          for d in ["mipmap-mdpi","mipmap-xhdpi","mipmap-xxhdpi","mipmap"]:
              os.makedirs(f"app/src/main/res/{d}", exist_ok=True)
              for name in ["ic_launcher.png","ic_launcher_round.png"]:
                  src = "app/src/main/res/mipmap-hdpi/ic_launcher.png"
                  dst = f"app/src/main/res/{d}/{name}"
                  if not os.path.exists(dst):
                      shutil.copy(src,dst)
          PY
          ls -R app/src/main/res/xml/
          rm -rf gradle/wrapper gradlew gradlew.bat
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          wget -q https://services.gradle.org/distributions/gradle-8.11-bin.zip
          unzip -q gradle-8.11-bin.zip -d /tmp
          export PATH=/tmp/gradle-8.11/bin:$PATH
          gradle assembleDebug --stacktrace
          find . -name "*.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-APK
          path: "**/build/outputs/apk/debug/*.apk"
