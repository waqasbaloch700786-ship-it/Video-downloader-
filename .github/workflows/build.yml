name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Project
        run: |
          for f in *.zip; do unzip -o "$f"; done || true
          rm -f *.zip
          if [ -f "AllVideoDownloader_Android_Project/gradlew" ]; then mv AllVideoDownloader_Android_Project/* .; mv AllVideoDownloader_Android_Project/.* . 2>/dev/null || true; fi
          if [ -f "downloader/gradlew" ]; then mv downloader/* .; mv downloader/.* . 2>/dev/null || true; fi
      - name: Fix Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then mkdir -p gradle/wrapper; curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar; fi
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-APK
          path: app/build/outputs/apk/debug/*.apk
